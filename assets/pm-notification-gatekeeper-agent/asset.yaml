apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: pm-notification-gatekeeper-agent
  version: "1.0.0"

provides:
  apis:
    - name: pm-notification-gatekeeper-agent
      kind: a2a
      ordId: customer.build:apiResource:pm-notification-gatekeeper-4fe41.pm-notification-gatekeeper-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-maintnotification-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:pm-notification-gatekeeper-4fe41.sap-s4-maintnotification-mcp-server:v1
  - name: sap-s4-equipment-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:pm-notification-gatekeeper-4fe41.sap-s4-equipment-mcp-server:v1
  - name: sap-s4-functionallocation-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:pm-notification-gatekeeper-4fe41.sap-s4-functionallocation-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
