---
# CF manifest for pm-notification-gatekeeper-agent.
# Default route: pm-notification-gatekeeper-agent.cfapps.eu11.hana.ondemand.com
applications:
  - name: pm-notification-gatekeeper-agent
    memory: 256M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:${PORT} --chdir app main:application
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /.well-known/agent.json
    services:
      - proj-vector-destination-service
    env:
      AGENT_PUBLIC_URL: https://pm-notification-gatekeeper-agent.cfapps.eu11.hana.ondemand.com/
      AICORE_DESTINATION_NAME: aicore
      AGENT_LLM_MODEL: gpt-4o
      LOG_LEVEL: INFO
