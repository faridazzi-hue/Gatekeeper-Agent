---
# CF manifest for pm-notification-gatekeeper-agent.
# Default route: pm-notification-gatekeeper-agent.cfapps.eu11.hana.ondemand.com
applications:
  - name: pm-notification-gatekeeper-agent
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:${PORT} --chdir app main:application
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /.well-known/agent.json
    services:
      - instanceAICore
      - proj-dest-service
      - proj-connectivity-service
    env:
      AGENT_PUBLIC_URL: https://pm-notification-gatekeeper-agent.cfapps.eu11.hana.ondemand.com/
      AICORE_DESTINATION_NAME: aicore
      AICORE_RESOURCE_GROUP: default
      AGENT_LLM_MODEL: gpt-4o
      SUMMARIZATION_LLM_MODEL: gpt-4o
      S4HANA_DESTINATION_NAME: S4HANA_QUALITY
      LOG_LEVEL: INFO
