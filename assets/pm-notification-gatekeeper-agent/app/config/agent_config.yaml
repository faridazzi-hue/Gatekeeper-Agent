# ---------------------------------------------------------------------------
# Attachment Requirement Rules
# ---------------------------------------------------------------------------
# Define which notification types or equipment classes require an attachment
# before the notification can be approved.
# Set required: false for all initially; update when attachment rules are confirmed.
attachment_requirements:
  - notification_type: M1
    required: false
    notes: "TODO: confirm whether M1 breakdown notifications require a photo attachment"
  - notification_type: M2
    required: false
    notes: "TODO: confirm attachment requirements for M2"

# ---------------------------------------------------------------------------
# Worklist Prioritization Weights
# ---------------------------------------------------------------------------
# Weights used to rank pending OSNO notifications in the gatekeeper worklist.
# Higher weight = higher priority in the list.
worklist_prioritization:
  abc_a_equipment: 30           # High-critical equipment
  abc_b_equipment: 20           # Medium-critical equipment
  abc_c_equipment: 10           # Low-critical equipment
  priority_very_high: 25
  priority_high: 20
  priority_medium: 10
  priority_low: 5
  m1_breakdown_yes: 20          # M1 with breakdown indicator = Yes
  suspected_duplicate: -15      # Lower priority if already suspected duplicate
  missing_required_info: 15     # Raise priority if key fields are inconsistent
  low_confidence: 10            # Raise priority for manual attention

# ---------------------------------------------------------------------------
# Audit Storage
# ---------------------------------------------------------------------------
# Destination for structured audit records written after each notification review.
# Supported types: file (write JSON lines to a local file), stdout (print to stdout).
# TODO: Update to the production audit destination before pilot go-live.
audit_storage:
  type: file
  path: /tmp/pm_gatekeeper_audit.jsonl   # TODO: replace with production path

# ---------------------------------------------------------------------------
# Email Draft Settings
# ---------------------------------------------------------------------------
# Controls how email drafts are presented. Currently text-only (copy-paste).
# Set outlook_integration: true once Outlook draft API is configured.
email_draft:
  outlook_integration: false    # TODO: enable when Outlook integration is configured
  language: en
