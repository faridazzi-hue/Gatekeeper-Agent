# Plant Maintenance Notification Gatekeeper Agent — Configuration
# All values in this file are loaded at runtime. Changes take effect on the next agent invocation
# without requiring a code deployment.

# ---------------------------------------------------------------------------
# SAP Backend Destination
# ---------------------------------------------------------------------------
# BTP destination name used by all three MCP servers to connect to the SAP S/4HANA system.
sap_destination: S4HANA_QUALITY

# ---------------------------------------------------------------------------
# SAP Action-to-Status Mapping
# ---------------------------------------------------------------------------
# Maps gatekeeper-confirmed decisions to SAP Maintenance Notification API actions
# and the expected resulting SAP status after each action.
action_to_status_mapping:
  approve:
    api_action: ApproveMaintWorkRequest
    expected_status: NOPR       # Notification in process / released
  reject:
    api_action: RejectMaintWorkRequest
    expected_status: REJA       # TODO: confirm rejection status code with SAP team
  rework:
    api_action: SetMaintNotifToInfoRequired
    expected_status: NOPO       # Notification postponed (rework in pilot configuration)
  in_process:
    api_action: SetMaintNotifToInProcess
    expected_status: NOPR
  complete:
    api_action: CompleteMaintNotification
    expected_status: NOCO       # Notification completed

# ---------------------------------------------------------------------------
# Notification Scope
# ---------------------------------------------------------------------------
# Notification types included in scope for this agent.
notification_types_in_scope:
  - M1
  - M2

# Initial screening status — only notifications with this status are retrieved.
screening_status: OSNO

# Open statuses considered for duplicate detection (NOCO excluded).
open_statuses_for_duplicate_detection:
  - OSNO
  - NOPR

