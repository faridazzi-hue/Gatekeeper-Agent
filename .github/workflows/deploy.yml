# Deploy pm-notification-gatekeeper-agent to BTP Cloud Foundry
# Trigger manually: Actions > Deploy to Cloud Foundry > Run workflow
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CF_API      - CF API endpoint, e.g. https://api.cf.eu11.hana.ondemand.com
#   CF_ORG      - CF org name
#   CF_SPACE    - CF space name
#   CF_USERNAME - SAP user email (technical/service account recommended)
#   CF_PASSWORD - SAP user password

name: Deploy to Cloud Foundry

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CF CLI v8
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cf-cli.gpg
          echo "deb [signed-by=/usr/share/keyrings/cf-cli.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y cf8-cli

      - name: CF Login
        run: |
          cf login \
            -a "${{ secrets.CF_API }}" \
            -u "${{ secrets.CF_USERNAME }}" \
            -p "${{ secrets.CF_PASSWORD }}" \
            -o "${{ secrets.CF_ORG }}" \
            -s "${{ secrets.CF_SPACE }}"

      - name: CF Push
        working-directory: assets/pm-notification-gatekeeper-agent
        run: cf push
